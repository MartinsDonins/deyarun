<!DOCTYPE html>
<html>
<head>
    <title>Generate Apple Touch Icon</title>
</head>
<body>
    <canvas id="canvas" width="180" height="180" style="border: 1px solid #ccc;"></canvas>
    <br><br>
    <button onclick="generateIcon()">Generate Apple Touch Icon</button>
    <br><br>
    <a id="downloadLink" style="display: none;">Download apple-touch-icon.png</a>

    <script>
        function generateIcon() {
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');
            
            // Create gradient background
            const gradient = ctx.createLinearGradient(0, 0, 180, 180);
            gradient.addColorStop(0, '#FF6B47');
            gradient.addColorStop(1, '#FF8C6B');
            
            // Draw rounded rectangle background
            const radius = 12; // iOS rounded corners
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.moveTo(radius, 0);
            ctx.lineTo(180 - radius, 0);
            ctx.quadraticCurveTo(180, 0, 180, radius);
            ctx.lineTo(180, 180 - radius);
            ctx.quadraticCurveTo(180, 180, 180 - radius, 180);
            ctx.lineTo(radius, 180);
            ctx.quadraticCurveTo(0, 180, 0, 180 - radius);
            ctx.lineTo(0, radius);
            ctx.quadraticCurveTo(0, 0, radius, 0);
            ctx.closePath();
            ctx.fill();
            
            // Draw "R" text
            ctx.fillStyle = 'white';
            ctx.font = 'bold 120px Arial, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('R', 90, 90);
            
            // Create download link
            canvas.toBlob(function(blob) {
                const url = URL.createObjectURL(blob);
                const link = document.getElementById('downloadLink');
                link.href = url;
                link.download = 'apple-touch-icon.png';
                link.style.display = 'inline';
                link.textContent = 'Download apple-touch-icon.png';
            });
        }
        
        // Auto-generate on load
        window.onload = generateIcon;
    </script>
</body>
</html>
