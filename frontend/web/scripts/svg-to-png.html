<!DOCTYPE html>
<html>
<head>
    <title>SVG to PNG Converter</title>
</head>
<body>
    <h2>DeyaRun Icon Generator</h2>
    <canvas id="canvas180" width="180" height="180" style="border: 1px solid #ccc;"></canvas>
    <canvas id="canvas32" width="32" height="32" style="border: 1px solid #ccc;"></canvas>
    <canvas id="canvas16" width="16" height="16" style="border: 1px solid #ccc;"></canvas>
    <br><br>
    <button onclick="generateIcons()">Generate All Icons</button>
    <br><br>
    <div id="downloads"></div>

    <script>
        const svgContent = `<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B47;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF8C6B;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="64" fill="url(#gradient)"/>
  <text x="256" y="290" font-family="Arial, sans-serif" font-size="320" font-weight="bold" text-anchor="middle" fill="white">R</text>
</svg>`;

        function generateIcon(canvasId, size, filename) {
            const canvas = document.getElementById(canvasId);
            const ctx = canvas.getContext('2d');
            
            const img = new Image();
            const svg = new Blob([svgContent], {type: 'image/svg+xml'});
            const url = URL.createObjectURL(svg);
            
            img.onload = function() {
                ctx.clearRect(0, 0, size, size);
                ctx.drawImage(img, 0, 0, size, size);
                
                canvas.toBlob(function(blob) {
                    const downloadUrl = URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.href = downloadUrl;
                    link.download = filename;
                    link.textContent = `Download ${filename}`;
                    link.style.display = 'block';
                    link.style.margin = '5px 0';
                    document.getElementById('downloads').appendChild(link);
                });
                
                URL.revokeObjectURL(url);
            };
            
            img.src = url;
        }
        
        function generateIcons() {
            document.getElementById('downloads').innerHTML = '';
            generateIcon('canvas180', 180, 'apple-touch-icon.png');
            generateIcon('canvas32', 32, 'favicon-32x32.png');
            generateIcon('canvas16', 16, 'favicon-16x16.png');
        }
        
        // Auto-generate on load
        window.onload = generateIcons;
    </script>
</body>
</html>
